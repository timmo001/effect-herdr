min_version = "2025.1.0"

[tools]
node = "26.13.1"
bun = "1.4.4"
# GitHub CLI for the Herdr schema refresh (scripts/update-herdr-schema.mts reads GitHub through gh).
gh = "2.105.0"
# The linters the hk pre-push hook runs, matching the shared lint workflows.
hk = "2.14.0"
pkl = "0.33.1"
uv = "0.13.9"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks."install:hooks"]
description = "Install the hk pre-push hook (shared lints on the files a push changes)"
run = "hk install"

[tasks.lint]
description = "Lint source with the shared Oxlint rules"
depends = ["install"]
wait_for = ["generate"]
run = "bun run lint"

[tasks.typecheck]
description = "Type-check source, type tests, tooling and examples"
depends = ["install"]
wait_for = ["generate"]
run = "bun run typecheck"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
wait_for = ["generate"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
wait_for = ["generate"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check, test and verify formatting"
depends = ["lint", "typecheck", "test", "format:check"]

[tasks.test]
description = "Run SDK contract tests"
depends = ["install"]
wait_for = ["generate"]
run = "bun run test"

[tasks.build]
description = "Build ESM and TypeScript declarations into dist"
depends = ["install"]
wait_for = ["generate"]
run = "bun run build"

[tasks.generate]
description = "Regenerate wire types from the bundled Herdr schema"
depends = ["install"]
run = "bun run generate"

[tasks."generate:check"]
description = "Fail when generated wire types differ from the bundled Herdr schema"
depends = ["generate"]
run = 'git diff --exit-code -- src/generated && test -z "$(git status --porcelain -- src/generated)"'

[tasks."tooling:refresh"]
description = "Bundle the Herdr schema from a herdrdev/herdr release, then regenerate the wire types"
depends = ["install"]
depends_post = ["generate"]
usage = 'arg "<tag>" help="Release tag, e.g. v0.9.3"'
run = "bun scripts/update-herdr-schema.mts --tag $usage_tag"
