min_version = "2025.1.0"

[tools]
node = "26.11.1"
bun = "1.4.3"
"npm:@timmo001/tooling-drift" = "0.1.0"

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Lint source with the shared Oxlint rules"
depends = ["install"]
wait_for = ["generate"]
run = "bun run lint"

[tasks.typecheck]
description = "Type-check source, type tests, tooling and examples"
depends = ["install"]
wait_for = ["generate"]
run = "bun run typecheck"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
wait_for = ["generate"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
wait_for = ["generate"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check, test and verify formatting"
depends = ["lint", "typecheck", "test", "format:check"]

[tasks.test]
description = "Run SDK contract tests"
depends = ["install"]
wait_for = ["generate"]
run = "bun run test"

[tasks.build]
description = "Build ESM and TypeScript declarations into dist"
depends = ["install"]
wait_for = ["generate"]
run = "bun run build"

[tasks.generate]
description = "Regenerate wire types from the bundled Herdr schema"
depends = ["install"]
run = "bun run generate"

[tasks."generate:check"]
description = "Fail when generated wire types differ from the bundled Herdr schema"
depends = ["generate"]
run = 'git diff --exit-code -- src/generated && test -z "$(git status --porcelain -- src/generated)"'

[tasks."tooling:status"]
description = "Compare the reviewed Herdr release in tooling.yml with the latest herdrdev/herdr release"
run = "tooling-drift status"

[tasks."tooling:refresh"]
description = "Bundle the Herdr schema from a herdrdev/herdr release, then regenerate the wire types"
depends = ["install"]
depends_post = ["generate"]
run = 'bun scripts/update-herdr-schema.mts --tag {{arg(name="tag")}}'

[tasks."tooling:update"]
description = "Refresh the bundled schema at a herdrdev/herdr release and record it in tooling.yml"
run = 'tooling-drift update herdrdev/herdr {{arg(name="tag")}}'

[tasks."tooling:publish"]
description = "Open or refresh a pull request when a newer Herdr release is out"
run = "tooling-drift publish"
