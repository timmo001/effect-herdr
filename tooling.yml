---
# Tool releases this SDK was last reviewed against. The tooling-drift tool
# (mise run tooling:status / tooling:publish) compares each with the latest
# release and opens a pull request when it moves; its README documents this
# file. This tracks Herdr itself; the SDK fork's upstream
# (dmmulroy/herdr-ts-sdk) is merged by the Sync upstream workflow instead,
# see FORK.md.
assignee: timmo001
tools:
  - repo: herdrdev/herdr
    reviewed: v0.9.5
    update: mise run tooling:refresh
    pins:
      - tooling.yml
      - package.json
    review: Adapt the SDK where CI fails against the new schema, and update the README protocol notes and docs/sdk-v1-parity.md to match. Repositories that use the SDK may need the same change.
