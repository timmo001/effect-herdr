---
name: Sync upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Open upstream sync pull request
    if: github.repository == 'timmo001/effect-herdr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      SYNC_BRANCH: sync/upstream
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          git fetch https://github.com/dmmulroy/herdr-ts-sdk.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$SYNC_BRANCH"
          if ! git merge --no-edit --no-ff FETCH_HEAD -m "Merge upstream main"; then
            git merge --abort
            echo "::error::Upstream main conflicts with this fork's main. Merge it by hand."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.merge.outputs.changed == 'true'
        run: git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"

      - name: Open pull request and run CI
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_pr=$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -z "$open_pr" ]; then
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "Merge upstream main" \
              --body "Merges the latest [dmmulroy/herdr-ts-sdk](https://github.com/dmmulroy/herdr-ts-sdk) main into this fork's main. Review before merging; upstream changes may need adapting to this fork's tooling."
          fi
          # Pull requests opened with GITHUB_TOKEN do not trigger pull_request workflows.
          gh workflow run ci.yml --ref "$SYNC_BRANCH"
