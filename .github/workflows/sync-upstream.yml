---
name: Sync upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'timmo001/effect-herdr'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERDR_VERIFY_TIMEOUT_MS: "300000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fork/main
          fetch-depth: 0
      - name: Merge upstream main
        id: merge
        run: |
          git fetch https://github.com/dmmulroy/herdr-ts-sdk.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit --no-ff FETCH_HEAD -m "Merge upstream main"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Set up mise
        if: steps.merge.outputs.changed == 'true'
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566
      - name: Verify merged source
        if: steps.merge.outputs.changed == 'true'
        run: |
          bun install --frozen-lockfile
          mise run check
          mise run build
      - name: Publish verified merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:fork/main
